version: '3.9'

# Production overrides for docker-compose.yml
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  nginx:
    restart: always
    labels:
      - "com.vayuguard.service=nginx"
      - "com.vayuguard.environment=production"

  postgres:
    restart: always
    environment:
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    labels:
      - "com.vayuguard.service=postgres"
      - "com.vayuguard.environment=production"

  backend:
    restart: always
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    labels:
      - "com.vayuguard.service=backend"
      - "com.vayuguard.environment=production"

  ml-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    labels:
      - "com.vayuguard.service=ml-service"
      - "com.vayuguard.environment=production"

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "com.vayuguard.service=frontend"
      - "com.vayuguard.environment=production"

  prometheus:
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      - "com.vayuguard.service=prometheus"
      - "com.vayuguard.environment=production"

  grafana:
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost/grafana
      GF_DASHBOARDS_ENABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      - "com.vayuguard.service=grafana"
      - "com.vayuguard.environment=production"

  data-pipeline:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "com.vayuguard.service=data-pipeline"
      - "com.vayuguard.environment=production"
