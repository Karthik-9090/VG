name: Data Pipeline Schedule

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vayuguard
          POSTGRES_USER: vayuguard_user
          POSTGRES_PASSWORD: vayuguard_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vayuguard_user -d vayuguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install data pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r data-pipeline/requirements.txt
      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            pg_isready -h localhost -p 5432 -U vayuguard_user -d vayuguard && break
            sleep 2
          done
      - name: Run data ingestion pipeline
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: vayuguard
          DB_USER: vayuguard_user
          DB_PASSWORD: vayuguard_pass
        run: |
          python data-pipeline/pipeline.py --source all --config data-pipeline/config.yml
