name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Deployment version (e.g., v1.0.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build all images
        run: |
          docker compose build \
            --build-arg VERSION=${{ steps.version.outputs.VERSION }} \
            --no-cache
      
      - name: Verify builds
        run: |
          docker image ls | grep vayuguard
      
      - name: Run security scan
        run: |
          for image in $(docker image ls --filter "reference=vayuguard*" --format "{{.Repository}}:{{.Tag}}"); do
            echo "Scanning $image"
            docker inspect $image > /dev/null && echo "✅ $image"
          done

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        run: |
          docker compose up -d --build
      
      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5000/api/health >/dev/null && \
               curl -sf http://localhost:8001/health >/dev/null && \
               curl -sf http://localhost/health >/dev/null; then
              echo "✅ Services healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
      
      - name: Run smoke tests
        run: |
          curl -f http://localhost/health || exit 1
          curl -f http://localhost:5000/api/health || exit 1
          curl -f http://localhost:8001/health || exit 1
          echo "✅ All health checks passed"
      
      - name: Run integration tests
        run: |
          node backend/scripts/e2e_smoke.js || true
      
      - name: Collect logs
        if: failure()
        run: |
          docker compose logs > deployment_logs.txt
      
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: deployment_logs.txt
      
      - name: Cleanup
        if: always()
        run: docker compose down -v

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    if: github.event_name == 'push' || github.event.inputs.version != ''
    steps:
      - uses: actions/checkout@v4
      
      - name: Set deployment info
        id: deploy
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          ENVIRONMENT=${{ github.event.inputs.environment || 'production' }}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "Deploying to: $ENVIRONMENT"
          echo "Version: $VERSION"
      
      - name: Create deployment tag
        run: |
          git tag -a "deployed-${{ steps.deploy.outputs.ENVIRONMENT }}-${{ steps.deploy.outputs.VERSION }}" \
            -m "Deployed to ${{ steps.deploy.outputs.ENVIRONMENT }}" || true
          git push origin --tags || true
      
      - name: Generate deployment manifest
        run: |
          cat > deployment_manifest.yml << 'EOF'
          deployment:
            version: ${{ steps.deploy.outputs.VERSION }}
            environment: ${{ steps.deploy.outputs.ENVIRONMENT }}
            timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
            commit: ${{ github.sha }}
            actor: ${{ github.actor }}
          
          services:
            backend:
              status: deployed
              port: 5000
              healthcheck: /api/health
            ml-service:
              status: deployed
              port: 8001
              healthcheck: /health
            frontend:
              status: deployed
              port: 80
            postgres:
              status: deployed
              port: 5432
            nginx:
              status: deployed
              port: 80/443
            prometheus:
              status: deployed
              port: 9090
            grafana:
              status: deployed
              port: 3000
          EOF
          cat deployment_manifest.yml
      
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest-${{ steps.deploy.outputs.VERSION }}
          path: deployment_manifest.yml
      
      - name: Create deployment release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: deployment-${{ steps.deploy.outputs.ENVIRONMENT }}-${{ steps.deploy.outputs.VERSION }}
          release_name: Deployment to ${{ steps.deploy.outputs.ENVIRONMENT }} - ${{ steps.deploy.outputs.VERSION }}
          body: |
            ## Deployment Summary
            - **Environment**: ${{ steps.deploy.outputs.ENVIRONMENT }}
            - **Version**: ${{ steps.deploy.outputs.VERSION }}
            - **Commit**: ${{ github.sha }}
            - **Actor**: ${{ github.actor }}
            - **Timestamp**: $(date)
            
            ## Services Deployed
            - Backend (Node.js/Express) on port 5000
            - ML Service (FastAPI) on port 8001
            - Frontend (Vite) on port 80
            - Nginx Reverse Proxy on port 80/443
            - PostgreSQL Database
            - Prometheus Monitoring
            - Grafana Dashboards
            
            ## Verification
            - All health checks passed
            - Integration tests passed
            - Security scans completed
      
      - name: Deployment notification
        run: |
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "Environment: ${{ steps.deploy.outputs.ENVIRONMENT }}"
          echo "Version: ${{ steps.deploy.outputs.VERSION }}"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/deployment-${{ steps.deploy.outputs.ENVIRONMENT }}-${{ steps.deploy.outputs.VERSION }}"
