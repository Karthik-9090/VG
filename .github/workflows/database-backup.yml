name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vayuguard
          POSTGRES_USER: vayuguard_user
          POSTGRES_PASSWORD: vayuguard_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vayuguard_user -d vayuguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create backup directory
        run: mkdir -p backups
      
      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            pg_isready -h localhost -p 5432 -U vayuguard_user -d vayuguard && break
            sleep 2
          done
      
      - name: Backup Database
        env:
          PGPASSWORD: vayuguard_pass
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="backups/vayuguard_backup_${TIMESTAMP}.sql"
          pg_dump -h localhost -U vayuguard_user -d vayuguard > "$BACKUP_FILE"
          gzip "$BACKUP_FILE"
          echo "BACKUP_FILE=${BACKUP_FILE}.gz" >> $GITHUB_ENV
          ls -lh "$BACKUP_FILE.gz"
      
      - name: Upload to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
      
      - name: Create release for backup
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: backup-${{ github.run_number }}
          release_name: Database Backup ${{ github.run_number }}
          body: |
            Automated database backup
            Timestamp: ${{ env.BACKUP_FILE }}
      
      - name: Cleanup old backups (keep last 30)
        run: |
          cd backups
          ls -1t | tail -n +31 | xargs -r rm
          echo "Cleanup complete"
      
      - name: Verify backup integrity
        env:
          PGPASSWORD: vayuguard_pass
        run: |
          # Extract and test restore
          BACKUP_FILE=$(ls -1t backups/*.sql.gz | head -1)
          zcat "$BACKUP_FILE" | wc -l
          echo "Backup file verified: $BACKUP_FILE"
